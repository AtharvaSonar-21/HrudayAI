
services:
  postgres:
    image: postgres:16
    container_name: hrudayai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hrudayai
      POSTGRES_USER: hrudayai_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrudayai_user -d hrudayai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    external: true
    name: d26124fd3369b62bb46f42d15efb7780be177e4097930b8f6a52d9da97d4e638